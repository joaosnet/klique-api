name: Android Build (Capacitor)

on:
  push:
    branches:
      - main
      - 'novaversãocomemailesenha'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build React app
        working-directory: frontend
        run: npm run build
        env:
          VITE_API_URL: https://fotodenatal.me

      - name: Install Capacitor CLI
        working-directory: frontend
        run: npm install @capacitor/cli @capacitor/core @capacitor/android --no-save

      - name: Initialize Android platform (if needed)
        working-directory: frontend
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi

      - name: Sync Capacitor
        working-directory: frontend
        run: npx cap sync android

      - name: Build Debug APK
        working-directory: frontend/android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: cp frontend/android/app/build/outputs/apk/debug/app-debug.apk frontend/android/app/build/outputs/apk/debug/omniflash.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: omniflash-debug-apk
          path: frontend/android/app/build/outputs/apk/debug/omniflash.apk
          retention-days: 7

      - name: Build Release AAB
        working-directory: frontend/android
        run: |
          chmod +x ./gradlew
          ./gradlew bundleRelease --no-daemon

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: omniflash-release-aab
          path: frontend/android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 7

      - name: Generate version tag
        id: version
        run: echo "tag=v$(date +'%Y.%m.%d')-build.${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: "OmniFlash ${{ steps.version.outputs.tag }}"
          body: |
            ## 🇧🇷 Português

            ### 📱 OmniFlash - Aplicativo Android

            Nova build do aplicativo OmniFlash gerada automaticamente.

            **Como instalar:**
            1. Baixe o arquivo `omniflash.apk` nos assets abaixo
            2. No Android, permita instalação de fontes desconhecidas
            3. Abra o arquivo e instale

            ---

            ## 🇺🇸 English

            ### 📱 OmniFlash - Android App

            New OmniFlash app build generated automatically.

            **How to install:**
            1. Download the `omniflash.apk` file from the assets below
            2. On Android, allow installation from unknown sources
            3. Open the file and install

            ---

            > Build: `${{ github.run_number }}` | Commit: `${{ github.sha }}`
          files: |
            frontend/android/app/build/outputs/apk/debug/omniflash.apk
          draft: false
          prerelease: false
