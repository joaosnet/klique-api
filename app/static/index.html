<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Klique Natal - Crie seu Avatar Natalino!</title>
    <meta name="description"
        content="Transforme sua foto em um ícone de Natal. Crie sua foto de perfil para Instagram ou WhatsApp.">

    <!-- Favicon SVG -->
    <link rel="icon" type="image/svg+xml"
        href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='45' fill='%231a5c3a'/%3E%3Cpath d='M50 15 L70 50 L30 50 Z' fill='%23c41e3a'/%3E%3Cpath d='M50 25 L65 45 L35 45 Z' fill='%23c41e3a'/%3E%3Cpath d='M50 10 L55 20 L45 20 Z' fill='%23c41e3a'/%3E%3Ccircle cx='50' cy='8' r='5' fill='%23ffd700'/%3E%3Crect x='45' y='50' width='10' height='15' fill='%238B4513'/%3E%3C/svg%3E">
    <meta name="theme-color" content="#1a5c3a">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/styles.css">
</head>

<body>
    <!-- Decorações Natalinas -->
    <div class="christmas-decorations">
        <div class="ornament ornament-1"></div>
        <div class="ornament ornament-2"></div>
        <div class="ornament ornament-3"></div>
        <div class="lights"></div>
    </div>

    <!-- Flocos de Neve Animados -->
    <div class="snowflakes" aria-hidden="true">
        <div class="snowflake">❄</div>
        <div class="snowflake">❅</div>
        <div class="snowflake">❆</div>
        <div class="snowflake">❄</div>
        <div class="snowflake">❅</div>
        <div class="snowflake">❆</div>
        <div class="snowflake">❄</div>
        <div class="snowflake">❅</div>
        <div class="snowflake">❆</div>
        <div class="snowflake">❄</div>
    </div>

    <main class="app-container">
        <!-- Header -->
        <header class="app-header">
            <h1 class="title">Torne-se um ícone de Natal!</h1>
            <p class="subtitle">Crie sua foto de perfil para Instagram ou WhatsApp.</p>
        </header>

        <!-- Editor Principal -->
        <section class="editor-section">
            <div class="editor-card">
                <!-- Área de Preview com Comparador -->
                <div class="preview-area">
                    <!-- Camera View -->
                    <div class="camera-zone" id="cameraZone">
                        <video id="cameraVideo" autoplay playsinline muted></video>
                        <button class="capture-btn" id="captureBtn" title="Tirar foto">
                            <svg width="32" height="32" viewBox="0 0 24 24" fill="currentColor">
                                <circle cx="12" cy="12" r="10" />
                            </svg>
                        </button>
                        <button class="gallery-btn" id="galleryBtn" title="Enviar foto da galeria">
                            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                stroke-width="2">
                                <rect x="3" y="3" width="18" height="18" rx="2" ry="2" />
                                <circle cx="8.5" cy="8.5" r="1.5" />
                                <polyline points="21 15 16 10 5 21" />
                            </svg>
                        </button>
                        <button class="switch-camera-btn" id="switchCameraBtn" title="Trocar câmera">
                            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                stroke-width="2">
                                <path d="M16 3h5v5M8 21H3v-5M21 3l-7 7M3 21l7-7" />
                            </svg>
                        </button>
                        <input type="file" id="galleryInput" accept="image/*" hidden>
                    </div>

                    <!-- Upload Fallback (shown if camera fails) -->
                    <div class="upload-zone" id="uploadZone" hidden>
                        <div class="upload-content">
                            <div class="upload-icon">📷</div>
                            <p class="upload-text">Arraste sua foto aqui</p>
                            <p class="upload-hint">ou clique para selecionar</p>
                            <input type="file" id="imageInput" accept="image/*" capture="user" hidden>
                        </div>
                    </div>

                    <!-- Comparador de Imagens -->
                    <div class="image-comparator" id="imageComparator" hidden>
                        <div class="comparator-wrapper">
                            <img class="comparator-image before" id="beforeImage" alt="Antes">
                            <div class="comparator-overlay" id="comparatorOverlay">
                                <img class="comparator-image after" id="afterImage" alt="Depois">
                            </div>
                            <div class="comparator-slider" id="comparatorSlider">
                                <div class="slider-handle">
                                    <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
                                        <path d="M8 5l-5 7 5 7M16 5l5 7-5 7" />
                                    </svg>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Loading State -->
                    <div class="loading-state" id="loadingState" hidden>
                        <div class="loading-spinner"></div>
                        <p class="loading-text">Processando sua imagem...</p>
                        <div class="progress-bar">
                            <div class="progress-bar-fill" style="width: 0%"></div>
                        </div>
                    </div>
                </div>

                <!-- Botões de Ação -->
                <div class="action-buttons" id="actionButtons" hidden>
                    <button class="action-btn primary" id="replaceBtn">
                        <span class="btn-icon">🔄</span>
                        Substituir
                    </button>
                    <button class="action-btn secondary" id="redoProcessBtn">
                        <span class="btn-icon">✨</span>
                        Refazer
                    </button>
                    <button class="action-btn secondary" id="compareBtn">
                        <span class="btn-icon">👁️</span>
                        Comparar
                    </button>
                </div>
            </div>
        </section>

        <!-- Templates Carousel -->
        <section class="templates-section" id="templatesSection">
            <div class="templates-carousel">
                <button class="carousel-nav prev" id="carouselPrev">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <polyline points="15 18 9 12 15 6" />
                    </svg>
                </button>

                <div class="carousel-container" id="carouselContainer">
                    <div class="carousel-track" id="carouselTrack">
                        <!-- Templates serão inseridos via JS -->
                    </div>
                </div>

                <button class="carousel-nav next" id="carouselNext">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <polyline points="9 18 15 12 9 6" />
                    </svg>
                </button>
            </div>

            <!-- Categoria Tabs -->
            <div class="category-tabs">
                <button class="category-tab active" data-category="todos">Todos</button>
                <button class="category-tab" data-category="populares">Populares</button>
                <button class="category-tab" data-category="classico">Clássico</button>
                <button class="category-tab" data-category="divertido">Divertido</button>
                <button class="category-tab" data-category="papai-noel">Papai Noel</button>
            </div>
        </section>

        <!-- Download Section -->
        <section class="download-section" id="downloadSection" hidden>
            <button class="download-btn" id="downloadBtn">
                <span class="btn-icon">⬇️</span>
                Baixar Imagem
            </button>
            <div class="share-buttons">
                <button class="share-btn whatsapp" id="shareWhatsApp">
                    <span>WhatsApp</span>
                </button>
                <button class="share-btn instagram" id="shareInstagram">
                    <span>Instagram</span>
                </button>
            </div>
        </section>
    </main>

    <script src="/static/app.js"></script>
</body>

</html>
