# Docker Compose Production - Standalone
# Use: docker compose -f docker-compose.production.yml up -d --build
#
# This is a STANDALONE production file - no need to merge with docker-compose.yml
# Includes: Traefik reverse proxy with Let's Encrypt SSL

services:
  # Traefik Reverse Proxy with Let's Encrypt SSL
  traefik:
    image: traefik:v2.11
    container_name: traefik
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik.yml:/etc/traefik/traefik.yml:ro
      - ./traefik-dynamic.yml:/etc/traefik/traefik-dynamic.yml:ro
      - letsencrypt:/letsencrypt
    environment:
      ACME_EMAIL: ${ACME_EMAIL}
    networks:
      - whatsapp-network
    healthcheck:
      test: [ "CMD", "traefik", "healthcheck" ]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  mongodb:
    image: mongo:latest
    container_name: mongodb_kliqueq
    restart: always
    volumes:
      - mongodb_data:/data/db
    env_file:
      - .env
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGO_INITDB_DATABASE}
    networks:
      - whatsapp-network
    healthcheck:
      test: [ "CMD", "mongosh", "--eval", "db.adminCommand('ping')" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    deploy:
      resources:
        limits:
          memory: 1G
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

  fastapi-app:
    container_name: fastapi-klique
    build: .
    restart: always
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - whatsapp-network
    env_file:
      - .env
    environment:
      TZ: ${TZ}
      SECRET_KEY: ${SECRET_KEY}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY}
      GOOGLE_APPLICATION_CREDENTIALS: ${GOOGLE_APPLICATION_CREDENTIALS}
      GOOGLE_DRIVE_ROOT_FOLDER_ID: ${GOOGLE_DRIVE_ROOT_FOLDER_ID}
      DB_CONNECTION: ${DB_CONNECTION}
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_DATABASE: ${DB_DATABASE}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      GMAIL_EMAIL: ${GMAIL_EMAIL}
      GMAIL_APP_PASSWORD: ${GMAIL_APP_PASSWORD}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      GROQ_API_KEY: ${GROQ_API_KEY}
      OPENAI_API_BASE: ${OPENAI_API_BASE}
      PUTER_API_KEY: ${PUTER_API_KEY}
      MP_ACCESS_TOKEN: ${MP_ACCESS_TOKEN}
      MP_PUBLIC_KEY: ${MP_PUBLIC_KEY}
      MP_WEBHOOK_SECRET: ${MP_WEBHOOK_SECRET}
      MIN_PAYMENT_AMOUNT: ${MIN_PAYMENT_AMOUNT}
      CREDITS_PER_REAL: ${CREDITS_PER_REAL}
      FREE_CREDITS_PER_USER: ${FREE_CREDITS_PER_USER}
      DEBUG: "false"
      ENVIRONMENT: "production"
    volumes:
      - gemini_cookies:/usr/local/lib/python3.12/site-packages/gemini_webapi/utils/temp
      - ./logs:/app/logs
    command: [ "uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "4" ]
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8000/docs" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 2G
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"

  frontend:
    container_name: klique-frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: always
    networks:
      - whatsapp-network
    labels:
      - "traefik.enable=true"
      # HTTP Router (redirects to HTTPS automatically via entrypoint config)
      - "traefik.http.routers.frontend.rule=Host(`${DOMAIN}`)"
      - "traefik.http.routers.frontend.entrypoints=web"
      # HTTPS Router
      - "traefik.http.routers.frontend-secure.rule=Host(`${DOMAIN}`)"
      - "traefik.http.routers.frontend-secure.entrypoints=websecure"
      - "traefik.http.routers.frontend-secure.tls=true"
      - "traefik.http.routers.frontend-secure.tls.certResolver=letsencrypt"
      # Apply middlewares
      - "traefik.http.routers.frontend-secure.middlewares=secure-headers@file,compress@file"
      # Service configuration
      - "traefik.http.services.frontend.loadbalancer.server.port=80"
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:80" ]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
