# Docker Compose Production Override
# Use: docker compose -f docker-compose.yml -f docker-compose.production.yml up -d
#
# Key differences from development:
# - Remove dev volumes (code sync)
# - Use restart policies
# - Add healthchecks
# - Optimize resource limits
# - Use production environment variables
# - Traefik reverse proxy with Let's Encrypt SSL

services:
  # Traefik Reverse Proxy with Let's Encrypt SSL
  traefik:
    image: traefik:v3.2
    container_name: traefik
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik.yml:/etc/traefik/traefik.yml:ro
      - ./traefik-dynamic.yml:/etc/traefik/traefik-dynamic.yml:ro
      - letsencrypt:/letsencrypt
    environment:
      ACME_EMAIL: ${ACME_EMAIL}
    networks:
      - whatsapp-network
    healthcheck:
      test: [ "CMD", "traefik", "healthcheck" ]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  mongodb:
    restart: always
    deploy:
      resources:
        limits:
          memory: 1G
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

  fastapi-app:
    restart: always
    # Remove dev volumes - use built image only
    volumes:
      - gemini_cookies:/usr/local/lib/python3.12/site-packages/gemini_webapi/utils/temp
      - ./logs:/app/logs
    environment:
      # Production settings
      DEBUG: "false"
      ENVIRONMENT: "production"
    # Override command for production with multiple workers
    command: [ "uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "4" ]
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8000/docs" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 2G
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"

  frontend:
    restart: always
    # Remove direct port exposure - Traefik handles it
    ports: []
    labels:
      - "traefik.enable=true"
      # HTTP Router (redirects to HTTPS automatically via entrypoint config)
      - "traefik.http.routers.frontend.rule=Host(`${DOMAIN}`)"
      - "traefik.http.routers.frontend.entrypoints=web"
      # HTTPS Router
      - "traefik.http.routers.frontend-secure.rule=Host(`${DOMAIN}`)"
      - "traefik.http.routers.frontend-secure.entrypoints=websecure"
      - "traefik.http.routers.frontend-secure.tls=true"
      - "traefik.http.routers.frontend-secure.tls.certResolver=letsencrypt"
      # Apply middlewares
      - "traefik.http.routers.frontend-secure.middlewares=secure-headers@file,compress@file"
      # Service configuration
      - "traefik.http.services.frontend.loadbalancer.server.port=80"
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:80" ]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
  # Disable WhatsApp and G4F in production if not needed
  # Uncomment if you want to exclude them:
  # whatsapp:
  #   profiles:
  #     - donotstart
  # g4f:
  #   profiles:
  #     - donotstart

volumes:
  letsencrypt:
