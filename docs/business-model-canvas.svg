    <rect x="20" y="90" width="180" height="35" rx="8" fill="#1a472a"/>
    <path d="M20,125 L20,98 Q20,90 28,90 L192,90 Q200,90 200,98 L200,125 Z" fill="#1a472a"/>
    <text x="30" y="113" class="box-header">🤝 Parcerias-Chave</text>
    
    <text x="30" y="145" class="box-content">
      <tspan x="30" dy="0">• Google Gemini</tspan>
      <tspan x="35" dy="16" style="font-size:10px;fill:#666">IA Generativa</tspan>
      <tspan x="30" dy="22">• Mercado Pago</tspan>
      <tspan x="35" dy="16" style="font-size:10px;fill:#666">Pagamentos PIX</tspan>
      <tspan x="30" dy="22">• Firebase</tspan>
      <tspan x="35" dy="16" style="font-size:10px;fill:#666">Autenticação</tspan>
      <tspan x="30" dy="22">• Traefik</tspan>
      <tspan x="35" dy="16" style="font-size:10px;fill:#666">SSL/Proxy reverso</tspan>
    </text>
  </g>
  
  <!-- Key Activities -->
  <g filter="url(#shadow)">
    <rect x="210" y="90" width="180" height="135" rx="8" fill="white" stroke="#1a472a" stroke-width="2"/>
    <rect x="210" y="90" width="180" height="35" rx="8" fill="#1a472a"/>
    <path d="M210,125 L210,98 Q210,90 218,90 L382,90 Q390,90 390,98 L390,125 Z" fill="#1a472a"/>
