      <tspan x="510" dy="14">• Personalização hiperlocal</tspan>
      <tspan x="510" dy="14">• Chat IA PT-BR refinado</tspan>
      <tspan x="510" dy="14">• Integrações B2B &amp; produtos</tspan>
    </text>
  </g>
  
