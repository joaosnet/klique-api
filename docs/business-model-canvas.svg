    <text x="40" y="520" class="cost-text">
      <tspan x="40" dy="0">• API Gemini - Custo por token/imagem gerada</tspan>
      <tspan x="40" dy="22">• Servidor - VPS/Cloud hosting (infra)</tspan>
      <tspan x="40" dy="22">• Domínio + SSL - fotodenatal.me</tspan>
    </text>
    <text x="340" y="520" class="cost-text">
      <tspan x="340" dy="0">• Dev time - Manutenção e novas features</tspan>
      <tspan x="340" dy="22">• MongoDB Atlas - Banco de dados</tspan>
      <tspan x="340" dy="22">• Taxas Mercado Pago - ~3% por transação</tspan>
    </text>
  </g> 
  
  <!-- Revenue Streams -->
  <g filter="url(#shadow)">
    <rect x="610" y="460" width="570" height="140" rx="8" fill="white" stroke="#228b22" stroke-width="2"/>
    <rect x="610" y="460" width="570" height="35" rx="8" fill="url(#revenueGradient)"/>
    <path d="M610,495 L610,468 Q610,460 618,460 L1172,460 Q1180,460 1180,468 L1180,495 Z" fill="url(#revenueGradient)"/>
    <text x="620" y="483" class="box-header">💵 Fontes de Receita</text>
    
    <text x="630" y="520" class="revenue-text">
      <tspan x="630" dy="0">• Venda de créditos via PIX (Mercado Pago)</tspan>
      <tspan x="630" dy="22">• Modelo Freemium: 1 grátis → conversão paga</tspan>
      <tspan x="630" dy="22">• Upsell: Imagem sem watermark; R$2 por refinamento extra</tspan>
      <tspan x="630" dy="22">• Produtos físicos (impressão) e B2B (APIs para agências)</tspan>
    </text>
    <text x="920" y="520" class="revenue-text">
      <tspan x="920" dy="0">• Pacotes de créditos (desconto volume)</tspan>
      <tspan x="920" dy="22">• Conversão guest → usuário pagante</tspan>
      <tspan x="920" dy="22">• Viral loop (indicações)</tspan>
    </text>
  </g> 
  
  <!-- Mapa dos Sonhos -->
  <g filter="url(#shadow)">
    <rect x="20" y="620" width="1160" height="110" rx="8" fill="white" stroke="#228b22" stroke-width="2"/>
    <rect x="20" y="620" width="1160" height="30" rx="8" fill="#228b22"/>
    <text x="30" y="650" class="box-header" style="font-size:13px">✨ Mapa dos Sonhos</text>
    <text x="40" y="670" class="box-content" style="font-size:12px;fill:#333">
      <tspan x="40" dy="0">• Freemium: 3 imagens grátis • Premium: R$ 9,90 por Mapa HD + texto afirmativo</tspan>
      <tspan x="40" dy="18">• MVP 7-10 dias: Backend FastAPI + Hugging Face (Flux.1 / Playground v2.5)</tspan>
      <tspan x="40" dy="18">• Prompt dinâmico e integração de selfie em cenas</tspan>
      <tspan x="40" dy="18">• Lançamento: "Mapa dos Sonhos 2026" (LinkedIn / TikTok)</tspan>
    </text>
  </g> 
  
  <!-- Footer -->
