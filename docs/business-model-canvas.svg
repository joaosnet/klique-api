<?xml version="1.0" encoding="UTF-8"?>
<svg width="1200" height="800" viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="headerGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#1a472a"/>
      <stop offset="100%" style="stop-color:#2d5a3f"/>
    </linearGradient>
    <linearGradient id="costGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#c41e3a"/>
      <stop offset="100%" style="stop-color:#8b0000"/>
    </linearGradient>
    <linearGradient id="revenueGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#228b22"/>
      <stop offset="100%" style="stop-color:#006400"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.15"/>
    </filter>
    <style>
      .title { font: bold 28px 'Segoe UI', Arial; fill: white; }
      .subtitle { font: 14px 'Segoe UI', Arial; fill: #e8e8e8; }
      .box-header { font: bold 14px 'Segoe UI', Arial; fill: white; }
      .box-content { font: 12px 'Segoe UI', Arial; fill: #333; }
      .box-emoji { font: 16px 'Segoe UI Emoji', Arial; }
      .highlight { font: bold 12px 'Segoe UI', Arial; fill: #1a472a; }
      .cost-text { font: 12px 'Segoe UI', Arial; fill: #333; }
      .revenue-text { font: 12px 'Segoe UI', Arial; fill: #333; }
    </style>
  </defs>
  
  <!-- Background -->
