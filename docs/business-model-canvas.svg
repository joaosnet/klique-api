    <rect x="400" y="90" width="220" height="280" rx="8" fill="white" stroke="#c41e3a" stroke-width="3"/>
    <rect x="400" y="90" width="220" height="40" rx="8" fill="#c41e3a"/>
    <path d="M400,130 L400,98 Q400,90 408,90 L612,90 Q620,90 620,98 L620,130 Z" fill="#c41e3a"/>
    <text x="415" y="117" class="box-header" style="font-size:15px">💡 Proposta de Valor</text>
    
    <text x="510" y="145" text-anchor="middle" style="font:bold 14px 'Segoe UI';fill:#1a472a">
      Transforme suas fotos em
    </text>
    <text x="510" y="160" text-anchor="middle" style="font:bold 14px 'Segoe UI';fill:#1a472a">
