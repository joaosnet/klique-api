  <g filter="url(#shadow)">
    <rect x="210" y="235" width="180" height="135" rx="8" fill="white" stroke="#1a472a" stroke-width="2"/>
    <rect x="210" y="235" width="180" height="35" rx="8" fill="#1a472a"/>
    <path d="M210,270 L210,243 Q210,235 218,235 L382,235 Q390,235 390,243 L390,270 Z" fill="#1a472a"/>
    <text x="220" y="258" class="box-header">🧰 Recursos-Chave</text>
    
    <text x="220" y="290" class="box-content">
