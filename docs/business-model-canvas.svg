      <tspan x="830" dy="28" style="font-weight:bold;fill:#1a472a">Influenciadores</tspan>
      <tspan x="835" dy="16" style="font-size:10px;fill:#666">Conteúdo sazonal</tspan>
      <tspan x="830" dy="28" style="font-weight:bold;fill:#1a472a">Empresas</tspan>
      <tspan x="835" dy="16" style="font-size:10px;fill:#666">Campanhas natalinas</tspan>
      <tspan x="830" dy="28" style="font-weight:bold;fill:#1a472a">Jovens Adultos</tspan>
      <tspan x="835" dy="16" style="font-size:10px;fill:#666">25-45 anos, tech-savvy</tspan>
    </text>
  </g>
  
  <!-- Cost Structure -->
  <g filter="url(#shadow)">
    <rect x="20" y="460" width="570" height="140" rx="8" fill="white" stroke="#c41e3a" stroke-width="2"/>
    <rect x="20" y="460" width="570" height="35" rx="8" fill="url(#costGradient)"/>
