<!doctype html>
<html lang="en">

<head>

  <link rel="icon" type="image/svg+xml" href="/src/assets/logo.svg" />

    content="Crie seu avatar de Natal mágico em segundos! Use Inteligência Artificial para se transformar em um personagem natalino único. 100% gratuito!" />

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>

  <!-- Analytics: Track clicks -->
  <script>
    (function () {
      try {
        fetch('/api/analytics/click', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            referrer: document.referrer,
            page: window.location.pathname
          })
        }).catch(function () { });
      } catch (e) { }
    })();
  </script>
</body>
