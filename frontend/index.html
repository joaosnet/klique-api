<!doctype html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <link rel="icon" type="image/svg+xml" href="/favicon-light.svg" media="(prefers-color-scheme: light)" />
  <link rel="icon" type="image/svg+xml" href="/favicon-dark.svg" media="(prefers-color-scheme: dark)" />
  <link rel="manifest" href="/manifest.json" />
  <!-- Apple and Android PWA icons supplied via manifest -->
  <meta name="theme-color" content="#303F9F" /> <!-- matches colorPrimaryDark from Android theme -->
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="OmniFlash" />

  <!-- SEO -->
  <title>OmniFlash — Simulador Universal de Teoria dos Jogos</title>
  <meta name="description"
    content="OmniFlash: plataforma de Teoria dos Jogos aplicada à Geopolítica, Negócios e Estratégia. Inspirado no método de Jiang Xueqin." />
  <meta name="keywords"
    content="teoria dos jogos, simulador, geopolítica, nash equilibrium, estratégia, jiang xueqin" />

  <!-- Open Graph -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="OmniFlash" />
  <meta property="og:description" content="O Futuro Pode Ser Previsto. Pode Ser Jogado." />
  <meta property="og:locale" content="pt_BR" />
</head>

<body>
  <script>
    // Apply theme before React paints to prevent flash of wrong theme
    (function () {
      var t = localStorage.getItem('app_theme');
      var resolved = (!t || t === 'auto')
        ? (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
        : t;
      document.documentElement.setAttribute('data-theme', resolved);
    })();
  </script>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
