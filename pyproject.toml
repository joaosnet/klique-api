[project]
name = "klique-api"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "apscheduler>=3.11.0",
    "fastapi[standard]>=0.120.0",
    "firebase-admin>=7.1.0",
    "google-auth>=2.41.1",
    "google-genai>=1.46.0",
    "httpx>=0.28.1",
    "langchain>=1.0.2",
    "langchain-google-genai>=3.0.0",
    "langchain-mcp-adapters>=0.1.11",
    "langchain-openai>=1.0.1",
    "langgraph>=1.0.1",
    "loguru>=0.7.3",
    "pillow>=12.0.0",
    "pwdlib[argon2]>=0.3.0",
    "pyjwt>=2.10.1",
    "pymongo>=4.10",
    "python-dotenv>=1.2.0",
    "python-jose>=3.5.0",
    "requests>=2.32.5",
    "rich>=14.2.0",
]

[dependency-groups]
dev = [
    "pytest>=8.4.2",
    "pytest-asyncio>=1.2.0",
    "ruff>=0.14.2",
    "taskipy>=1.14.1",
]

[tool.pytest.ini_options]
pythonpath = "."
addopts = "-v --tb=short -p no:warnings"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
python_files = ["test_*.py"]
required_plugins = ["pytest-asyncio"]

[tool.ruff]
line-length = 79
extend-exclude = ['migrations']

[tool.ruff.lint]
preview = true
select = ['I', 'F', 'E', 'W', 'PL', 'PT']
# ignore = ["E501", "PLR2004"]

[tool.ruff.format]
preview = true
quote-style = 'single'

[tool.taskipy.tasks]
lint = 'ruff check . && ruff check . --diff'
pre_format = 'uv sync --dev'
format = 'ruff check . --fix && ruff format .'
pre_run = 'task format'
run = 'fastapi dev app/main.py --host 0.0.0.0'
prod = 'uvicorn --host 0.0.0.0 app/main:app'
pre_test = 'task format'
start = 'sudo supervisorctl stop fastapi & task run'
back = 'sudo supervisorctl start fastapi'
test = 'pytest -s -x --cov=app -vv'
post_test = 'coverage html' 
nav = 'python -c "from pathlib import Path; import webbrowser; webbrowser.open(Path(\"htmlcov/index.html\").resolve().as_uri())"'
